name = "lean_env"
defaultTargets = ["Harness"]

# Keep these revs and ../lean_env/lean-toolchain on the same Lean version.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[require]]
name = "REPL"
git = "https://github.com/leanprover-community/repl.git"
rev = "v4.36.0"

# Server-side helpers (axiom checking etc.). Depends only on core Lean,
# so it builds fast and does not need Mathlib.
[[lean_lib]]
name = "Harness"

# Trusted final checker (see HarnessVerify.lean). Imports only core Lean.
[[lean_exe]]
name = "harness_verify"
root = "HarnessVerify"
